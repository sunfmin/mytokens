# TEMPORARY (sunfmin/control#757): what the ASC API key may do. Prints status codes and counts only.
name: probe
on:
  push:
    branches: ['sunfmin/sunfmin-control-757-mytokens-github-actions-builds-signs-not']
jobs:
  probe:
    runs-on: macos-26
    steps:
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          ruby <<'RB'
          require 'openssl'; require 'base64'; require 'json'; require 'net/http'
          key = OpenSSL::PKey::EC.new(Base64.decode64(ENV['ASC_KEY_P8_BASE64']))
          b = ->(s){ Base64.urlsafe_encode64(s).delete('=') }
          now = Time.now.to_i
          input = b.(JSON.dump(alg: 'ES256', kid: ENV['ASC_KEY_ID'], typ: 'JWT')) + '.' +
                  b.(JSON.dump(iss: ENV['ASC_ISSUER_ID'], iat: now, exp: now + 600, aud: 'appstoreconnect-v1'))
          r, s = OpenSSL::ASN1.decode(key.sign('SHA256', input)).value.map { |i| i.value.to_s(2).rjust(32, "\0")[-32, 32] }
          jwt = input + '.' + b.(r + s)
          get = ->(path) {
            u = URI("https://api.appstoreconnect.apple.com#{path}")
            req = Net::HTTP::Get.new(u); req['Authorization'] = "Bearer #{jwt}"
            Net::HTTP.start(u.host, u.port, use_ssl: true) { |h| h.request(req) }
          }
          res = get.('/v1/users?limit=1')
          puts "GET /v1/users: #{res.code} (200 means an Admin-role key)"
          res = get.('/v1/certificates?limit=200&fields[certificates]=certificateType,name')
          puts "GET /v1/certificates: #{res.code}"
          if res.code == '200'
            certs = JSON.parse(res.body)['data']
            certs.group_by { |c| c['attributes']['certificateType'] }.each { |t, cs| puts "  #{t}: #{cs.size}" }
            puts "  named 'Created via API': #{certs.count { |c| c['attributes']['name'].to_s.include?('Created via API') }}"
          end
          res = get.('/v1/profiles?limit=200&fields[profiles]=profileType,profileState')
          puts "GET /v1/profiles: #{res.code}"
          if res.code == '200'
            JSON.parse(res.body)['data'].group_by { |p| p['attributes'].values_at('profileType','profileState').join(' ') }.each { |t, ps| puts "  #{t}: #{ps.size}" }
          end
          RB
